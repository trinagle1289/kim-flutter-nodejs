name: kim_lhc_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.2.5 <4.0.0"

dependencies:
  camera: ^0.11.0+1
  chunked_uploader: ^1.1.0
  dio: ^5.4.3+1
  flutter:
    sdk: flutter
  format: ^1.5.2
  image_picker: ^1.1.2
  path: ^1.8.3
  path_provider: ^2.1.3
  video_compress_plus: ^1.0.0
  video_player: ^2.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/kim_icon.jpg"

flutter:
  assets:
    - assets/picture/LHC/
    - assets/picture/LHC/Poses/
    - assets/icons/
  uses-material-design: true
